name: Android TV APK
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:
    inputs:
      version_name:
        description: Semantic version
        default: '1.0.0'
        required: true
      version_code:
        description: Increasing Android version code
        default: '1'
        required: true
      config_url:
        description: Public HTTPS super admin server (optional)
        default: ''
permissions:
  contents: read
jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Prepare optional production signing
        if: github.event_name != 'pull_request'
        env:
          SIGNING_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$SIGNING_KEY" ]; then
            printf '%s' "$SIGNING_KEY" | base64 --decode > "$RUNNER_TEMP/savrdh.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/savrdh.jks" >> "$GITHUB_ENV"
          fi
      - name: Build and lint TV application
        working-directory: android
        env:
          VERSION_NAME: ${{ inputs.version_name || '1.0.0' }}
          VERSION_CODE: ${{ inputs.version_code || '1' }}
          CONFIG_URL: ${{ inputs.config_url || '' }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleDebug :app:assembleRelease :app:lintRelease :remote:assembleDebug :remote:assembleRelease :remote:lintRelease
      - name: Generate APK checksums
        run: find android/app/build/outputs/apk android/remote/build/outputs/apk -name '*.apk' -exec sha256sum {} \; > APK-SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: savrdh-tv-apks-${{ github.run_number }}
          path: |
            android/app/build/outputs/apk/**/*.apk
            android/remote/build/outputs/apk/**/*.apk
            android/app/build/reports/lint-results-release.html
            android/remote/build/reports/lint-results-release.html
            APK-SHA256.txt
